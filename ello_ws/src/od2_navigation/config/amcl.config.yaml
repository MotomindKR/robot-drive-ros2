amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: "base_link"
    scan_topic: scan_filtered
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: true
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.15
    alpha5: 0.2
    laser_model_type: "beam"
    laser_max_range: 15.0
    laser_min_range: 0.1
    max_beams: 120
    
    
    
